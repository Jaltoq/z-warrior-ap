<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Z-WARRIOR OS — Scouter HUD // Silnik Trudności &amp; Transformacji</title>

  <!-- Konfiguracja PWA (Android & iOS) -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#ff6b00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Z-Warrior OS" />
  <link rel="apple-touch-icon" href="./icon-512.png" />

  <!-- Supabase JS v2 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS — DARK SCI-FI DRAGON BALL SCOUTER HUD
       ========================================================================= */
    :root {
      --bg-body: #090d16;
      --bg-card: #101726;
      --bg-card-alt: #162035;
      --bg-card-deep: #0b101c;
      --bg-input: #060911;
      --border: #1e293b;
      --border-light: #334155;

      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --orange: #ff6b00;
      --orange-bright: #ff8c24;
      --orange-glow: rgba(255, 107, 0, 0.36);

      --scouter: #22c55e;
      --scouter-neon: #4ade80;
      --scouter-soft: rgba(34, 197, 94, 0.13);
      --scouter-border: rgba(34, 197, 94, 0.45);

      --cyan: #38bdf8;
      --cyan-soft: rgba(56, 189, 248, 0.14);
      --gold: #facc15;
      --gold-soft: rgba(250, 204, 21, 0.14);
      --purple: #a855f7;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.14);

      /* 5 Głównych Statystyk */
      --stat-str: #ff6b00;
      --stat-agi: #facc15;
      --stat-end: #22c55e;
      --stat-cns: #38bdf8;
      --stat-spi: #a855f7;

      /* Dynamiczna Aura Aktywnej Transformacji */
      --aura-color: #ff6b00;
      --aura-secondary: #ff8c24;
      --aura-glow: rgba(255, 107, 0, 0.42);
      --aura-bg: rgba(255, 107, 0, 0.12);

      --radius-xl: 16px;
      --radius-lg: 12px;
      --radius-md: 10px;
      --radius-sm: 8px;

      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Bahnschrift', 'Segoe UI Semibold', system-ui, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      overflow-x: hidden;
    }

    body {
      background-image:
        radial-gradient(circle at 12% 0%, rgba(255, 107, 0, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 88% 4%, rgba(34, 197, 94, 0.08) 0%, transparent 38%),
        linear-gradient(rgba(148, 163, 184, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      padding-bottom: max(56px, env(safe-area-inset-bottom));
    }

    /* =========================================================================
       2. NAGŁÓWEK STICKY I PRZYCISKI
       ========================================================================= */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 120;
      background: rgba(9, 13, 22, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .sticky-inner { max-width: 1340px; margin: 0 auto; padding: 10px 14px 8px; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 40px; height: 40px; border-radius: 11px;
      background: linear-gradient(135deg, var(--orange-bright), var(--orange));
      color: #090d16; font-family: var(--font-display); font-weight: 900; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 18px var(--orange-glow); flex-shrink: 0;
    }

    .brand-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.05; }
    .brand-name span { color: var(--orange); }
    .brand-sub { font-family: var(--font-mono); font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; color: var(--scouter-neon); margin-top: 2px; }

    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

    .header-pl-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
      border-radius: 999px; background: var(--scouter-soft); border: 1px solid var(--scouter-border);
      font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700; color: #86efac; white-space: nowrap;
    }
    .header-pl-pill strong { color: var(--scouter-neon); font-size: 0.88rem; text-shadow: 0 0 10px rgba(34, 197, 94, 0.55); }
    .header-pl-pill.over-9000 { background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(250, 204, 21, 0.25)); border-color: var(--gold); color: #fef08a; animation: pulseAura 1.3s infinite alternate; }
    .header-pl-pill.over-9000 strong { color: var(--gold); }
    @keyframes pulseAura { from { box-shadow: 0 0 8px rgba(250, 204, 21, 0.25); } to { box-shadow: 0 0 22px rgba(250, 204, 21, 0.7); } }

    .cloud-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; min-height: 36px;
      border-radius: var(--radius-sm); border: 1px solid var(--border-light); background: var(--bg-card);
      color: var(--text-main);
